# HTTP 强制跳转 HTTPS
server {
    listen 80;
    server_name ssl.domain.com;

    return 301 https://ssl.domain.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ssl.domain.com;

    ssl_certificate     /home/vesoft/ssl/domain.com/fullchain.pem;
    ssl_certificate_key /home/vesoft/ssl/domain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 所有代理 location 继承这些设置
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 下载页入口：补齐尾斜杠
    location = /download {
        return 301 /download/$is_args$args;
    }

    # 删除 /download/ 前缀后转发到下载服务
    location ^~ /download/ {
        proxy_pass http://127.0.0.1:8081/;
    }

    # 下载页面使用的证书列表 API
    location = /api/certificates {
        proxy_pass http://127.0.0.1:8081;
    }

    # 支持 /ssl-renew.sh?domain=example.com
    location = /ssl-renew.sh {
        proxy_pass http://127.0.0.1:8081;
    }

    # 证书、私钥及对应域名的客户端脚本
    # 正则 location 中，proxy_pass 不添加尾斜杠
    location ~ ^/[^/]+/(fullchain\.pem|privkey\.pem|ssl-renew\.sh)$ {
        proxy_pass http://127.0.0.1:8081;
    }

    # 管理页面、管理 API 和共享静态资源
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
