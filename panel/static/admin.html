<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACME · 证书管理</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/style.css"><script src="/assets/common.js" defer></script><script src="/assets/select.js" defer></script><script src="/assets/admin.js" defer></script></head>
<body class="admin-page">
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">∗</span>ACME <span class="muted">/ 证书管理</span></div><div class="top-right"><div class="top-right" id="user-bar" hidden><span class="mono small">admin</span><button class="quiet" id="logout">退出登录</button></div><a class="github-link" href="https://github.com/yuhongwei380/acme-dns-panel" target="_blank" rel="noopener noreferrer" aria-label="打开 GitHub 仓库（新窗口）" title="GitHub 仓库"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.23c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.81 5.62-5.49 5.92.43.37.82 1.1.82 2.22v3.3c0 .32.22.7.83.58A12.01 12.01 0 0 0 24 12.5C24 5.87 18.63.5 12 .5Z"/></svg></a></div></header>
<main id="login-view" class="login"><section class="login-card"><div class="eyebrow">DNS → CERTIFICATE</div><h1>管理你的证书</h1><p class="intro">配置一次，让域名验证与证书续期自动完成。</p><div class="account-fixed"><span class="muted">管理员账户</span><strong class="mono">admin</strong></div><form id="login-form"><label for="login-password">管理员密码<div class="password-wrap"><input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus><button type="button" class="eye" data-eye="login-password" aria-label="显示密码" aria-pressed="false"></button></div></label><div id="login-error" class="error" role="alert"></div><button class="primary" type="submit">登录管理面板</button></form><p class="footnote">首次登录的默认密码为 <span class="mono">admin</span></p></section></main>
<main id="app-view" class="shell" hidden><nav class="tabs" aria-label="管理导航"><button class="tab active" data-tab="domains">域名证书</button><button class="tab" data-tab="accounts">DNS 账户</button><button class="tab" data-tab="jobs">任务记录</button><button class="tab" data-tab="script">客户端脚本</button><button class="tab" data-tab="deployment">快速部署</button><button class="tab" data-tab="settings">服务设置</button></nav><section id="content"><div class="loading">正在加载配置…</div></section></main>
<footer class="site-footer"><span><strong>©Powered by </strong><a href="https://github.com/yuhongwei380/acme-dns-panel" target="_blank" rel="noopener noreferrer">ACME-DNS-Panel</a></span></footer>
<dialog id="editor"><header class="dialog-head"><h2 id="editor-title"></h2><button type="button" data-close="editor" aria-label="关闭">×</button></header><div class="dialog-body" id="editor-body"></div></dialog>
<dialog id="logs"><header class="dialog-head"><h2>任务日志</h2><button type="button" data-close="logs" aria-label="关闭">×</button></header><div class="dialog-body"><p id="log-status" class="muted small"></p><pre id="log-content" class="log"></pre></div></dialog>
<dialog id="confirm"><header class="dialog-head"><h2 id="confirm-title">确认操作</h2><button type="button" data-close="confirm" aria-label="关闭">×</button></header><form id="confirm-form" class="dialog-body"><p id="confirm-message"></p><div id="confirm-password-field"></div><p id="confirm-error" class="error" role="alert"></p><div class="form-actions"><button type="button" data-close="confirm">取消</button><button type="submit" id="confirm-yes" class="danger">确认移除</button></div></form></dialog>
<dialog id="copy-dialog"><header class="dialog-head"><h2>复制下载地址</h2><button type="button" data-close="copy-dialog" aria-label="关闭">×</button></header><div class="dialog-body"><p class="muted small">浏览器未允许自动复制，按 Ctrl+C 或长按复制下方内容。</p><textarea id="copy-text" readonly aria-label="待复制内容"></textarea></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
